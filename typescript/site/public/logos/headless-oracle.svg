<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Headless Oracle logo">
  <defs>
    <style>
      .ho-bg     { fill: #0F172A; }
      .ho-bar    { fill: #F8FAFC; }
      .ho-accent { fill: #10B981; }
      .ho-node   { fill: #F8FAFC; }

      @media (prefers-color-scheme: light) {
        .ho-bg     { fill: #F8FAFC; }
        .ho-bar    { fill: #0F172A; }
        .ho-accent { fill: #059669; }
        .ho-node   { fill: #0F172A; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="36" class="ho-bg"/>

  <!-- H: Left vertical bar -->
  <rect x="48" y="52" width="22" height="152" rx="3" class="ho-bar"/>

  <!-- H: Right vertical bar -->
  <rect x="186" y="52" width="22" height="152" rx="3" class="ho-bar"/>

  <!--
    Ascending crossbar — oracle market signal.
    Left (x=70) y-center 130, right (x=186) y-center 90. Rise 40px over 116px (19deg). 22px thick.
  -->
  <polygon points="70,141 70,119 186,79 186,101" class="ho-accent"/>

  <!--
    Oracle reading node — verification point at midpoint (128,110).
    Outer ring (theme-adaptive) + inner dot (accent): scope / verified-reading metaphor.
  -->
  <circle cx="128" cy="110" r="13" class="ho-node"/>
  <circle cx="128" cy="110" r="6"  class="ho-accent"/>
</svg>
