<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Globe - horizontal lines -->
  <ellipse cx="230" cy="260" rx="130" ry="130" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
  <ellipse cx="230" cy="260" rx="70" ry="130" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>
  <ellipse cx="230" cy="260" rx="25" ry="130" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  <line x1="100" y1="220" x2="360" y2="220" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
  <line x1="100" y1="260" x2="360" y2="260" stroke="rgba(255,255,255,0.2)" stroke-width="6"/>
  <line x1="100" y1="300" x2="360" y2="300" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>

  <!-- Globe outer ring -->
  <circle cx="230" cy="260" r="130" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="12"/>

  <!-- Chat bubble (overlapping globe, top-right) -->
  <g transform="translate(310, 110)">
    <path d="M0,60 Q0,0 60,0 L120,0 Q180,0 180,60 L180,100 Q180,140 140,140 L60,140 L30,170 L30,140 Q0,140 0,100 Z"
          fill="white" opacity="0.95"/>
    <!-- Three dots in chat bubble -->
    <circle cx="55" cy="70" r="12" fill="url(#bg)" opacity="0.7"/>
    <circle cx="90" cy="70" r="12" fill="url(#bg)" opacity="0.85"/>
    <circle cx="125" cy="70" r="12" fill="url(#bg)"/>
  </g>

  <!-- Small signal arcs around globe (connectivity) -->
  <path d="M120,150 Q100,130 120,110" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="6" stroke-linecap="round"/>
  <path d="M100,160 Q70,130 100,100" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="6" stroke-linecap="round"/>
</svg>
