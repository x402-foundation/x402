packages:
  - packages/core
  - packages/extensions
  - packages/mcp
  - packages/http/*
  - packages/mechanisms/*
  - packages/legacy/*
  - examples/**/*
  - site
overrides:
  cssstyle: 5.3.6
packageExtensions:
  # @keetanetwork/anchor imports tslib at runtime but does not declare it.
  "@keetanetwork/anchor@*":
    dependencies:
      tslib: "^2.8.1"
minimumReleaseAge: 4320 # Only install package versions that have been published for at least 3 days.
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  # token-2022 0.16.0 is the only release compatible with @solana/kit v8; its
  # release-train siblings (@solana/kit 8.0.0, @solana-program/token 0.16.0)
  # already cleared the age gate.
  - "@solana-program/token-2022"
allowBuilds:
  bigint-buffer: true
  bufferutil: true
  esbuild: true
  keccak: true
  protobufjs: true
  secp256k1: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
