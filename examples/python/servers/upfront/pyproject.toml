[project]
name = "x402-upfront-fastapi-example"
version = "0.1.0"
description = "FastAPI server demonstrating the upfront payment flow on the exact scheme"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["x402", "payment", "protocol", "http", "402", "upfront"]
dependencies = [
    "x402[fastapi,evm,svm]",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
]

[tool.uv]
required-version = ">=0.11.0"
exclude-newer = "3 days"
package = false

[tool.uv.sources]
x402 = { path = "../../../../python/x402", editable = true }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["x402"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
