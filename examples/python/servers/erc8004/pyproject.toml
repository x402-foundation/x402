[project]
name = "x402-erc8004-server-example"
version = "0.1.0"
description = "ERC-8004 agent resource server with x402 payment middleware"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["x402", "erc8004", "fastapi", "402"]
dependencies = [
    "x402[fastapi,evm,extensions]",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.40.0",
    "eth-account>=0.13.0",
]

[tool.uv]
package = false

[tool.uv.sources]
x402 = { path = "../../../../python/x402", editable = true }
