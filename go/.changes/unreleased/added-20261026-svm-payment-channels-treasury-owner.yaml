body: 'SVM upto and batch-settlement: Config.PaymentChannelsTreasuryOwner overrides the treasury owner the payment-channels program was built with, so distribute, the readiness simulation and rent cleanup work against a custom or local program build. The zero key keeps the deployed program''s owner for the network; paymentchannels.ResolveTreasuryOwner applies the same rule.'
