kind: Changed
body: Validate unsupported paymentFlow / assetTransferMethod at HTTP server Initialize and MCP NewPaymentWrapper when the scheme is registered; return a generic internal error from HTTP and MCP wrappers for unexpected failures; and bring MCP PaymentWrapper to HTTP-equivalent cancel/settleOnCancel, SkipHandler, CreatePaymentRequiredResponse, and extension-gated verify/settle with failure-path payment-response in _meta. Fixed SVM exact #3094 parity (dynamic recentBlockhash/lastValidBlockHeight extras, settlement-cache drop on send/confirm failure) and MCP match/validate parity (match post-enrichment accepts, extension_echo_mismatch before verify). MCP OnAfterExecution now runs on handler IsError results; hook-abort 402s omit the payment payload; GetPaymentFlow errors when no scheme is registered.
