kind: fixed
body: 'SVM batch-settlement `BatchChannelManager` no longer resubmits a claim, distribute or seal forever when the transaction confirmed but its response was lost. The facilitator answers a claim at or below the onchain `settled` watermark (`cumulative_amount_mismatch`), a distribute with nothing left to sweep (`cumulative_amount_mismatch`) and a seal on a channel that is no longer `Closing` or with a voucher below `settled` (`close_state`) as a `SettleResponse` carrying `extra.channelStates[]` of `{channelId, status, balance, totalClaimed, payoutWatermark, withdrawRequestedAt}`, and a successful `settle` carries it too, also in the stored payout result a retry replays. The server adopts the entries only when the response is bound to its network and names exactly the submitted channels with `payoutWatermark <= totalClaimed <= balance`: a claim batch resyncs the channels already claimed and re-claims the rest once, a distribute adopts `payoutWatermark`, and a seal records a `distributed` channel as paid out or a `sealed` one by its `settled` value, none of them counted as new claims or seals. On success without a facilitator state the server infers `Settled = SignedMaxClaimable` after a claim without `extra.accepts` and `PayoutWatermark = Settled` after a distribute. **Breaking:** the manager reads the chain only through a configured `ReadSettledWatermark`, `ReadPayoutWatermark` or `RPCURL` and no longer falls back to the network''s public RPC; a deployment that relied on that fallback sets `RPCURL`. Wire format is additive: the new `extra.channelStates` field is ignored by older servers, which keep their previous behavior.'
