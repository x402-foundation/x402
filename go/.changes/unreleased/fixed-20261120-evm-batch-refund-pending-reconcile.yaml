kind: fixed
body: 'EVM batch-settlement refunds record a broadcast transaction in the `PendingSettlementStore` when the receipt wait fails, as deposits already do. A retry of the same refund (same channel and refund nonce, whatever amount it recomputes) waits on that transaction instead of re-simulating it, so a refund that already landed no longer fails with `invalid_batch_settlement_evm_refund_simulation_failed` or `refund_no_balance`, and a direct-mode retry no longer refunds twice. The retry stays `settlement_pending` until the transaction confirms and the advanced refund nonce is visible onchain; a reverted one is terminal. `SubmitContext` gains an optional `PendingStore`; nil keeps the previous behavior.'
time: 2026-11-20T12:00:00Z
