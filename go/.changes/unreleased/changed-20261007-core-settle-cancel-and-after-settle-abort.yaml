kind: changed
body: Call scheme SettleOnCancel even when no before-handler settle has completed, passing the completed phases so the scheme decides. A failure-path receipt includes a cancel settle only when a before-handler settlement exists; otherwise it echoes that settlement or is omitted. AfterSettleAbortError fails an onchain-successful settle closed (success false, keeping transaction, amount, payer, and onchain extra) on the normal path and the beforeSettle skip path; other afterSettle errors stay non-fatal and are logged. The aborted receipt skips response enrichment and keeps its transaction, amount, and extra in HTTP PAYMENT-RESPONSE and MCP _meta. afterVerify hooks run on a facilitator isValid:false response, while onVerifyFailure runs only on thrown verify errors. SVM upto and auth-capture SettleOnCancel return nothing unless the before-handler settle already completed. MCP rethrows a handler error when there is no failure receipt.
time: 2026-10-07T21:30:00Z
