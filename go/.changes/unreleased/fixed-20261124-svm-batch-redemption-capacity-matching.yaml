kind: fixed
body: 'SVM batch-settlement leaves extra.maxClaimChannels and extra.maxSettleChannels out of requirements matching, as it already does recentBlockhash and recentSlot: both are in DynamicExtraFields. The server copies them from the facilitator''s /supported kind. They size only its own claim and settle batches; no message the payer signs includes them, and the facilitator checks requests against its own capacity. Previously, when a facilitator changed the capacity it advertised, a server running several processes refused a batch payment whose 402 came from a process holding the other value, in FindMatchingRequirements and again in the facilitator''s Verify (invalid_payment_requirements), until every process had read /supported again.'
time: 2026-11-24T12:00:00Z
