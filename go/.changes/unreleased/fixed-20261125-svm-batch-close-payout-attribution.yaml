kind: fixed
body: 'SVM batch-settlement attributes the merchant payout of a fresh seal or cooperative refund from the confirmed close transaction, not from the channel read taken before it was sent. A sweep that advanced the payout watermark in between made the response, the stored payout record and OnDistributionConfirmed report more than the close paid. A refund keeps its payer-facing amount and reports the verified payout in extra.paidToReceiver. When the transaction metadata is not visible in time the close answers settlement_pending and a retry attributes it, as for a recovered close.'
time: 2026-11-25T17:00:00Z
