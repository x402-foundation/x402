kind: fixed
body: 'SVM batch-settlement attributes the merchant payout of a fresh seal or cooperative refund from the confirmed close transaction, not from the channel read taken before it was sent. A sweep or top-up in between made the response, the stored payout record and OnDistributionConfirmed report amounts the close did not move. A refund reports the verified payout in extra.paidToReceiver. Its amount and the channel balance also come from the transaction, so a top-up that landed before the close is reflected. When the transaction metadata is not visible in time the close answers settlement_pending and a retry attributes it, as for a recovered close. NewBatchSvmScheme now panics unless the signer implements GetConfirmedTransaction (svm.FacilitatorConfirmedTransactionReader), which svm.ConfirmedTransactionEvidence provides over an rpc.Client.'
time: 2026-11-25T17:00:00Z
