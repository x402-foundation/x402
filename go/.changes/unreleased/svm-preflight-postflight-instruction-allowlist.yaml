kind: added
body: 'Added an optional preflight/postflight instruction-tuple allowlist to the exact SVM facilitator Path 1 (static layout) verifier. Config.PreflightInstructionAllowlist and Config.PostflightInstructionAllowlist let a sponsor accept a fixed, pre-vetted block of extra instructions (by program ID + discriminator) immediately before/after the required protocol instructions - e.g. atomically channeling funds from an out-of-band mechanism into the same transaction as the merchant transfer. Guard (Lighthouse) instructions may be interspersed within a matched block. A matched block is fee-payer-isolation-checked before being accepted. An empty tuple or empty discriminator never matches (fail closed). Both allowlists default to empty, which is a strict no-op - existing behavior is unchanged unless explicitly configured.'
time: 2026-09-29T00:00:00.000000-07:00
