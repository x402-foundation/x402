kind: fixed
body: 'SVM schemes report a transaction the chain confirmed with an execution error as a terminal settle failure, not settlement_pending. A signer returns the new svm.TransactionFailedError from ConfirmTransaction; svm.RecordPendingOrTerminal then keeps the signature on the error and clears the pending record instead of asking callers to keep reconciling. Timeouts and RPC failures are still settlement_pending. ([#3644](https://github.com/x402-foundation/x402/issues/3644))'
