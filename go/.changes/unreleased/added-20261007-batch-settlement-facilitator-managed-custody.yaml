kind: added
body: Add facilitator-managed voucher custody for EVM batch-settlement. extra.voucherManager is "server" or "facilitator" (omitted means "server"; /supported advertises both). extra.delegatedRefund is always emitted on /supported and is true only when the facilitator sets ResolveCallerIdentity. A managed RefundAuthorizerSigner puts extra.refundAuthorizer on the 402; without a signer the server relies on delegatedRefund and omits it. Managed refunds are authorized by a server signature or by caller identity (the facilitator strips client signatures and re-signs). Admission locks use pendingId and release on cancel. chargeCount is attested onchain per claim in ERC-8021 m.x402ChargeCounts and read back with DecodeClaimAttestation. Storage is a shared in-memory, file, and Redis package with worker query helpers. ChannelStorage is Get/List/UpdateChannel CAS-only (blind Set/Delete are removed; breaking for custom storage implementors), pendingRequest is no longer on ChannelSession, and locks live on ChannelLockStorage so durable storage and locks can be mixed. The client accepts a channel salt as a non-negative index or bytes32 hex and packs refundAuthorizer into the salt only for facilitator-managed 402s. World Chain USDC (eip155:480 and eip155:4801) is a default asset.
