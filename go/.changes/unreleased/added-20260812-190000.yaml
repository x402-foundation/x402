kind: Added
body: Add the SVM `upto` scheme (client, server, facilitator) for usage-based billing on Solana, backed by hand-written payment-channels program bindings in mechanisms/svm/paymentchannels. The client escrows a maximum in an onchain channel, the server signs a voucher for the metered amount, and the facilitator sponsors fees/rent, co-signs and broadcasts the open, settles the claim, and reclaims channel rent through RentCleanupManager over a pluggable ChannelStorage. Cleanup runs on a short interval from storage while the optional getProgramAccounts recovery sweep (Discover) runs on its own longer interval, and both prefer an injected *rpc.Client over the configured RPC URL so operators can route sends through their own instrumented transport
