kind: fixed
body: 'Gin, Echo and net/http middleware: the handler-threw, handler-aborted and handler-failed paths now resolve settlement cancellation through one shared helper. A handler that sets settlement overrides no longer leaks the internal Settlement-Overrides header to the client on those paths, and ProcessSettlement now strips it on the before-handler receipt-echo path too, which covers flows such as upfront that never settle after the handler.'
time: 2026-11-07T17:05:00Z
