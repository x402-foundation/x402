kind: fixed
body: 'Gin middleware: a handler or downstream middleware that writes a 400+ response and then aborts now delivers that response. Previously the abort branch discarded the captured status and body, so the client received an empty 200 while the payment was withheld. Aborts are no longer a special case: settlement is decided by response status alone, so a 400+ response withholds settlement and anything below 400 settles, matching the Echo, net/http and TypeScript adapters. Gin previously never settled an aborted request, so a handler that served a response and aborted now settles where it previously did not.'
