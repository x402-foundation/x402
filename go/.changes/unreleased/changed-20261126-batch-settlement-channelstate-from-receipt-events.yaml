kind: changed
body: 'The batch-settlement EVM facilitator derives deposit and refund settle `extra.channelState` from the receipt''s `Deposited`, `Claimed` and `Refunded` events plus the pre-transaction channel read, with no post-confirmation channel-state polls. Voucher verification, and the managed voucher mirror, re-read up to three times with backoff when the read balance is below the voucher''s `maxClaimableAmount`. A failed refund pre-read now rejects with `invalid_batch_settlement_evm_rpc_read_failed` before broadcast. `WaitForTransactionReceipt` on the facilitator signer (and on `AuthorizerSubmitter`) must return receipt `Logs`; a receipt without them fails with the new `invalid_batch_settlement_evm_receipt_logs_unavailable` and keeps the delegated deposit binding, since the deposit may have landed, and a successful deposit receipt without a matching `Deposited` event fails with `invalid_batch_settlement_evm_deposit_transaction_failed`. Managed deposits stamp the stored row''s `OnchainSyncedAt` with the verify read''s sample time and keep the higher `refundNonce` and `withdrawRequestedAt`. A managed refund keeps the higher stored `refundNonce` when `channelState` reports a lower one. Managed refunds read channel state once, capping and deriving from the same read, and stamp with that read''s sample time when the derived channelState includes balance. A managed refund whose channelState omits balance sets `OnchainSyncedAt` to 0. The resource server keeps the larger `totalClaimed` and `refundNonce` when applying a settle response, keeps a deposit's stored `withdrawRequestedAt`, and clears `withdrawRequestedAt` when a refund response carries 0. The facilitator advertises `extra.delegatedRefund` next to `receiverAuthorizer`, true only when `ResolveCallerIdentity` is configured. A caller-identity refund checks the channel config, reads the channel, and rejects a zero refundable amount before signing. Deposit `channelState.balance` is the last matching `Deposited` event. The resource server sets `OnchainSyncedAt` to 0 when a refund snapshot omits `balance`, and when a deposit snapshot omits `totalClaimed` or `withdrawRequestedAt`, so the next voucher re-reads the chain. A present settle `channelState` field that is not a canonical non-negative integer is rejected with `invalid_batch_settlement_evm_refund_payload`; a missing object or field keeps the stored value. The resource server releases its admission lock when that snapshot is omitted, rejected, or applied.'
