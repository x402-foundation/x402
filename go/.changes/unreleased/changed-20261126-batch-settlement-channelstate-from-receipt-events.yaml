kind: changed
body: 'The batch-settlement EVM facilitator derives deposit and refund settle `extra.channelState` from the receipt''s `Deposited`, `Claimed` and `Refunded` events plus the pre-transaction channel read, with no post-confirmation channel-state polls. Voucher verification, and the managed voucher mirror, re-read up to three times with backoff when the read balance is below the voucher''s `maxClaimableAmount`. A failed refund pre-read now rejects with `invalid_batch_settlement_evm_channel_state_read_failed` before broadcast. `WaitForTransactionReceipt` on the facilitator signer (and on `AuthorizerSubmitter`) must return receipt `Logs`; a receipt without them fails with the new `invalid_batch_settlement_evm_receipt_logs_unavailable` and keeps the delegated deposit binding, since the deposit may have landed, and a successful deposit receipt without a matching `Deposited` event fails with `invalid_batch_settlement_evm_deposit_transaction_failed`. Managed deposits stamp the stored row''s `OnchainSyncedAt` with the verify read''s sample time, and managed refunds read channel state once, capping and deriving from the same read, and stamp with that read''s sample time. The resource server keeps the larger `totalClaimed` when applying a settle response. Unchanged on the wire.'
time: 2026-11-26T12:00:00Z
