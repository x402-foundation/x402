kind: fixed
body: The net/http, Gin and Echo middleware now drop headers the route handler set when settlement fails, so the 402 no longer carries the paid route's Set-Cookie, Content-Disposition, Content-Type or Content-Length. Headers set before the handler, such as CORS, are kept. Adds the x402http.RestoreHeaders helper the adapters share.
