kind: added
body: 'SVM exact, upto and batch-settlement: client-built transactions now support Solana transaction v1 (SIMD-0385). Facilitators advertise transactionVersions [0, 1]; clients build the highest mutually supported version, carrying the compute budget in the v1 message config (computeUnitLimit, a 4 MiB loadedAccountsDataSizeLimit, and the equivalent total priorityFee) instead of ComputeBudget instructions. svm.ClientConfig.TransactionVersions and BatchSvmClientConfig.TransactionVersions narrow the client set (e.g. []int{0} for a signer that cannot sign v1). Verifiers accept v1 exact payments (TransferChecked first, 1-5 instructions), opens, top-ups and request_close transactions, require computeUnitLimit and loadedAccountsDataSizeLimit, cap priorityFee * 1e6 <= cap * computeUnitLimit without overflow, and reject v1 messages that contain a ComputeBudget instruction or request a heap size. A message version outside legacy/0/1 is rejected from its raw bytes with unsupported_transaction_version before decoding.'
