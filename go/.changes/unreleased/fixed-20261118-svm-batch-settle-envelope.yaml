kind: fixed
body: 'SVM batch-settlement `Settle` now enforces the same envelope check as `Verify` (spec 4.5): `paymentPayload.accepted` must equal `paymentRequirements` apart from the per-402 `extra` fields (`recentSlot`, `recentBlockhash` and the other `DynamicExtraFields`). A mismatch returns a `SettleResponse` with `success: false`, `errorReason` `unsupported_scheme` for a non-`batch-settlement` scheme or `invalid_payment_requirements` for any other difference, before any channel read, storage write or broadcast. Wire format unchanged: callers that already forward matching requirements are unaffected.'
time: 2026-11-18T12:00:00Z
