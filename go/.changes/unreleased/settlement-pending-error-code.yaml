kind: changed
body: Add a `settlement_pending` error reason for the `exact`, `upto`, and `batch-settlement` EVM schemes (v2 only; v1 is unaffected). A receipt-wait failure after a settle/claim/deposit/refund transaction broadcast (e.g. an RPC error or timeout) now returns `settlement_pending` with the broadcast transaction hash and network instead of the previous terminal error, since the transaction may still confirm on chain — callers relying on the old terminal error reason for this case should switch to handling `settlement_pending`. Settlement now also validates the broadcast transaction hash before waiting on it, so a signer that reports success without a usable hash fails terminally rather than reporting `settlement_pending` without a hash to reconcile against. An ERC-20-approval-gas-sponsoring extension signer that fails to broadcast a valid settlement transaction hash for `exact`/`upto` Permit2 settlement now reports `erc20_approval_broadcast_failed` (previously the internal-only sentinel `erc20_approval_tx_failed` could leak through as the error reason). The HTTP resource server now unwraps a `SettleError` returned by Settle instead of flattening it into `err.Error()`, so the structured error reason, payer, network, and transaction hash reach the caller and the `PAYMENT-RESPONSE` header.
