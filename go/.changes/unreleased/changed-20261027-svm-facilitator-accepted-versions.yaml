kind: changed
body: 'SVM facilitators take their accepted transaction-version set and apply the spec sponsor defaults. The exact, upto and batch-settlement facilitator configs gain TransactionVersions (default [0, 1]), advertised as extra.transactionVersions; a client transaction of another version is rejected with unsupported_transaction_version before any instruction is inspected, and legacy is accepted exactly when version 0 is (svm.IsAcceptedTransactionVersionIn, svm.NormalizeAcceptedTransactionVersions). Behaviour change: the exact facilitator now defaults MaxRequiredSignatures to 2 (no required signer beyond the client and the sponsor) and MaxComputeUnits to 400,000 (the reference default, for SetComputeUnitLimit and the version-1 header alike). While MaxComputeUnits is nil, a smart-wallet transaction above 400,000 CU still reaches the smart-wallet path and is judged against SmartWalletMaxComputeUnits (one invoking no allowlisted wallet program keeps compute_limit_instruction_too_high); a set MaxComputeUnits bounds both paths. MaxRequiredSignatures is checked before path dispatch, so a threshold multisig whose members co-sign the payment transaction needs it raised. The upto Verify refuses an open whose channel already exists, and upto payloads accept openSlot as a JSON number. The batch-settlement facilitator checks every settlement ATA''s token state (initialized, unfrozen, mint, owner, extensions) and the payer''s balance against the deposit, and judges openSlot against the cluster slot when extra.recentSlot is absent; the client refuses extra.feePayer equal to its own key; the server refuses a voucher or authorization on a closing channel with channel_closing and an off-watermark client refund with close_state.'
time: 2026-10-27T15:00:00Z
