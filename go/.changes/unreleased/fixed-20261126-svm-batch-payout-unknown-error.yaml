kind: fixed
body: 'SVM batch-settlement BatchChannelManager reports `distribute confirmed but payout unknown: facilitator sent no channelStates and neither RPCURL nor ReadPayoutWatermark is set` through OnError when a successful distribute carries no usable extra.channelStates and neither ReadPayoutWatermark nor RPCURL is set. Previously the channel stayed payable with no signal until a later distribute failed with a cumulative_amount_mismatch. If your facilitator does not return extra.channelStates, set RPCURL or ReadPayoutWatermark; otherwise distributed channels stay payable.'
time: 2026-11-26T15:00:00Z
