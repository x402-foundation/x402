kind: changed
body: '**Breaking:** SVM batch-settlement facilitator `/settle` now costs about two storage operations instead of seven to fifteen and succeeds only when the call broadcast and confirmed the transaction itself or finished a `settlement_pending` record found at its start. `batch-settlement/facilitator.Config` takes `PendingSettlementStore x402.PendingSettlementStore` (unset defaults to a process-local store that keeps entries for `PendingRetention`, 24 hours) and the new `DuplicateSettlementStore svm.DuplicateSettlementStore` (`Reserve`/`Release`, in-memory default `svm.NewInMemoryDuplicateSettlementStore`) in place of the batch-local `PendingSettlementStore`, `ConditionalPendingStore` and `InMemoryPendingSettlementStore`, which are removed together with `CompletedBroadcastSuffix`. The facilitator reserves the signed signature before sending, so a concurrent duplicate answers `duplicate_settlement` instead of broadcasting or sharing the holder''s success, and writes the pending store only when a confirmation times out. Top-up and `request_close` keys use the transaction message hash. A claim at or below the onchain `settled` watermark fails with `cumulative_amount_mismatch`, and a `request_close` retry on a `Closing` channel fails with `close_state`. A retry of a completed `seal`, refund or `distribute` fails with `close_state` or `cumulative_amount_mismatch` and carries no transaction signature. A distribute keeps its pending record per channel set and finishes an unfinished payout before starting another pass, also after a later claim moved the watermarks or rent cleanup reclaimed the channel; only its duplicate reservation follows the `settled` watermark. With `OnDistributionConfirmed` set, the payout record is written once the transaction confirms and deleted after the hook has run; a retry that finds it runs the hook again, deletes it and returns the payout, and a failed hook or delete answers `settlement_pending` and keeps the record, so the hook stays at-least-once and idempotent per transaction. The in-memory default stores check only the requested entry''s expiry and sweep the rest at most once a minute. The timeout record carries the signed transaction and its blockhash: a retry sends the kept transaction again while it can still land, and drops it once its blockhash expired without landing, then broadcasts afresh. A retry of a deposit whose open timed out and has since landed is answered, like the exact schemes, only from its pending signature: when the channel holds exactly the open''s deposit with nothing settled, the deposit is the payer-signed open of that channel and a pending signature is recorded, it is reconciled and cleared once, for a delegated channel only for the caller that opened it; without a record the deposit is judged as a top-up and rejected as before. Wire format unchanged.'
