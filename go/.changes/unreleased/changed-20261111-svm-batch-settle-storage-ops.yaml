kind: changed
body: '**Breaking:** SVM batch-settlement facilitator `/settle` now costs about two storage operations instead of seven to fifteen. `batch-settlement/facilitator.Config` takes `PendingSettlementStore x402.PendingSettlementStore` and the new `DuplicateSettlementStore svm.DuplicateSettlementStore` (`Reserve`/`Release`, in-memory default `svm.NewInMemoryDuplicateSettlementStore`) in place of the batch-local `PendingSettlementStore`, `ConditionalPendingStore` and `InMemoryPendingSettlementStore`, which are removed together with `CompletedBroadcastSuffix`. The facilitator reserves the signed signature before sending, so a concurrent duplicate reconciles the holder instead of broadcasting, and writes the pending store only when a confirmation times out. Top-up and `request_close` keys use the transaction message hash, claims already at or below the onchain `settled` watermark are answered from channel state, and distribute keys follow the `settled` watermark. Without `OnDistributionConfirmed`, a retry of a completed `seal`, refund or `distribute` is answered from channel status and carries no transaction signature. With the hook set, results are still retained so it receives every payout. The broadcast wire and expiry records are gone: an unconfirmed transaction stays pending until the reservation lapses. Wire format unchanged.'
time: 2026-11-11T12:00:00Z
