kind: changed
body: '**Breaking:** SVM batch-settlement facilitator `/settle` now costs about two storage operations instead of seven to fifteen. `batch-settlement/facilitator.Config` takes `PendingSettlementStore x402.PendingSettlementStore` (unset defaults to a process-local store that keeps entries for `PendingRetention`, 24 hours) and the new `DuplicateSettlementStore svm.DuplicateSettlementStore` (`Reserve`/`Release`, in-memory default `svm.NewInMemoryDuplicateSettlementStore`) in place of the batch-local `PendingSettlementStore`, `ConditionalPendingStore` and `InMemoryPendingSettlementStore`, which are removed together with `CompletedBroadcastSuffix`. The facilitator reserves the signed signature before sending, so a concurrent duplicate reconciles the holder instead of broadcasting, and writes the pending store only when a confirmation times out. Top-up and `request_close` keys use the transaction message hash, claims already at or below the onchain `settled` watermark are answered from channel state, and distribute keys follow the `settled` watermark. Without `OnDistributionConfirmed`, a retry of a completed `seal`, refund or `distribute` is answered from channel status and carries no transaction signature. With the hook set, results are still retained so it receives every payout, for as long as the pending store keeps them. The timeout record carries the signed transaction and its blockhash: a retry sends the kept transaction again while it can still land, and drops it once its blockhash expired without landing, then broadcasts afresh. A retry of a deposit whose open timed out and has since landed is answered, like the exact schemes, only from its pending signature: when the channel holds exactly the open's deposit with nothing settled, the deposit is the payer-signed open of that channel and a pending signature is recorded, it is reconciled and cleared once, for a delegated channel only for the caller that opened it; without a record the deposit is judged as a top-up and rejected as before. Wire format unchanged.'
