kind: fixed
body: 'Fixed SkipHandler skipping settlement on payment flows that settle before the handler, in the HTTP resource server and the MCP payment wrapper. A skipped request now settles like a normal one: the before-handler settle runs first and the after-handler settle echoes or completes it. Previously an upfront skip response was released with no settlement, and on escrow (for example auth-capture) the before-handler authorize was skipped, so captureMode "sync" failed and "deferred" left no authorized-payment record to capture later.'
