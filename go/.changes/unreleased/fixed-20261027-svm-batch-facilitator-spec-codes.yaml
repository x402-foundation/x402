kind: fixed
body: 'SVM batch-settlement facilitator reports the spec error codes for setup transactions and the request envelope. A deposit whose open or top_up transaction fails the sponsor checks is invalid_batch_settlement_svm_setup_transaction instead of transaction_failed; a foreign binding Memo is receiver_authorizer_mismatch, a grace period other than extra.withdrawDelay is withdraw_delay_mismatch, and an unaccepted message version is unsupported_transaction_version. A deposit proof the escrow cannot cover is cumulative_exceeds_deposit rather than cumulative_amount_mismatch, and a refund of a sealed or distributed channel, or one whose voucher lies outside the settled-to-deposit range, is close_state. The batch server classifies its own setup-transaction failures the same way. Verify requires paymentPayload.accepted to equal paymentRequirements in every field except the per-402 recentBlockhash and recentSlot, and reports a mismatch (including a network mismatch) as invalid_payment_requirements instead of network_mismatch.'
time: 2026-10-27T12:00:00Z
