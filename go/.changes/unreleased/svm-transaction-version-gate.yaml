kind: fixed
body: Reject Solana transactions whose message version the SVM schemes cannot police with the reason `unsupported_transaction_version`. Facilitator verification derives its sponsorship policy from ComputeBudget instructions, which transaction v1 (SIMD-0385) replaces with an inline message config, so a v1 or later message would otherwise pass those checks with nothing for them to inspect and leave the facilitator's priority fee unbounded. The exact scheme (v2 and the legacy v1 wire scheme) and the payment-channels open verification now allow only legacy and v0, checked before any instruction is read.
