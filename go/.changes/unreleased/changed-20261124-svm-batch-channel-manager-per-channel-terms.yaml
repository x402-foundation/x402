kind: changed
body: 'SVM CreateChannelManager is now CreateChannelManager(facilitator, network, config), the same call as EVM, and returns no error. Breaking: the requirements argument and BatchChannelManagerConfig.Requirements are removed; pass the network instead. The worker builds each claim, settle and seal request from the stored ChannelState (FeePayer, Receiver, Mint, TokenProgram, WithdrawDelay, ChannelConfig.ReceiverAuthorizer) and groups batches by those terms, so channels opened under different facilitator fee payers redeem in one pass. Batch capacity comes from the maxClaimChannels and maxSettleChannels the scheme records in ValidateFacilitatorSupport (four before then, still clamped to the protocol maximum and MaxChannelsPerBatch). Redemption requests use maxTimeoutSeconds 300, which is also the seal CloseAuthorization validBefore window. BatchChannelManagerConfig takes Network and an optional Capacity reader. Wire format and facilitator behavior are unchanged.'
time: 2026-11-24T22:30:00Z
