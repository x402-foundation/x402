kind: added
body: 'Support Solana transaction v1 (SIMD-0385) in the exact SVM scheme. A v1 payment declares its compute budget in the message config instead of ComputeBudget instructions, so the facilitator now validates that config — compute unit limit and loaded accounts data size limit are both required, the total-lamport priority fee is normalized against the per-compute-unit cap, and heap size is allowed — and accepts the shorter 1-5 instruction layout with TransferChecked first. Both the static and the smart wallet path enforce this, each under its own caps; a ComputeBudget instruction inside a v1 transaction is rejected by both. New reason codes: invalid_exact_svm_payload_transaction_config_compute_limit_missing, invalid_exact_svm_payload_transaction_config_compute_limit_too_high, invalid_exact_svm_payload_transaction_config_loaded_accounts_data_size_limit_missing, invalid_exact_svm_payload_transaction_config_priority_fee_too_high, invalid_exact_solana_smart_wallet_compute_unit_limit_missing, invalid_exact_solana_smart_wallet_loaded_accounts_data_size_limit_missing, invalid_exact_solana_smart_wallet_unsupported_transaction_version. The legacy x402 v1 wire scheme and the upto payment-channels open still accept only legacy and v0, rejecting anything newer with unsupported_transaction_version.'
