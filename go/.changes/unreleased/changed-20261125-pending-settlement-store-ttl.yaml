kind: changed
body: '**Breaking:** `x402.NewInMemoryPendingSettlementStore` accepts options, and `x402.WithPendingSettlementTTL` sets the store''s TTL (default `PendingSettlementTTL`, 5 minutes; a TTL <= 0 keeps the default). `Get` checks only the requested entry, `Set` sweeps expired entries at most once a minute, and `Entries` omits expired entries. The SVM batch-settlement facilitator splits its store: `Config.PendingSettlementStore` now holds only settle-pending records and defaults to `x402.NewInMemoryPendingSettlementStore()` (5 minutes) like the other schemes, and the new `Config.PayoutStore` (also on `SealDependencies`) holds payout records for `OnDistributionConfirmed`, defaulting to an in-memory store that keeps them for `PayoutRetention` (24 hours, renamed from `PendingRetention`). One instance may serve both if its TTL is at least `PayoutRetention`.'
