kind: added
body: Add Sperax USD (USDs) on Arbitrum One (eip155:42161) as a Permit2 default asset, so "$0.10 USDs" resolves and clients recognize USDs under default spend controls; bare "$0.10" still resolves to USDC. USDs has no EIP-3009 and its permit() does not set allowances, so SupportsEip2612 stays false and first payments use ERC-20 approval gas sponsoring.
time: 2026-09-18T02:00:00Z
