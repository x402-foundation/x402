kind: fixed
body: 'EVM batch-settlement self-managed mode: `BatchSettlementChannelManager` now claims and refunds only channels bound to its own `Network`, so a manager sharing a store with another network no longer submits or refunds that network''s channels through the wrong facilitator. Claim, refund, idle-refund, `SelectRefundChannels` and `GetWithdrawalPendingSessions` selection are scoped in memory by the persisted `ChannelSession.Network`, falling back to the channel-id binding for rows written without one. Server writes (BeforeVerify/AfterVerify snapshots, AfterSettle deposit and refund commits, managed replica) now stamp `ChannelSession.Network` from the request requirements. `Claim` now continues past a failed batch instead of aborting: it returns the successful batch results together with the joined batch errors, sets pending settle when any batch succeeded, and leaves failed batches claimable for the next pass. `ClaimAndSettle` settles after a partial claim and returns the joined claim and settle errors, and the auto-claim job still reports `OnClaim` for the batches that succeeded. Unchanged on the wire.'
time: 2026-11-05T07:00:00Z
