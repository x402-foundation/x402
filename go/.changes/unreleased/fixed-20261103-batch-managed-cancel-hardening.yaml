kind: fixed
body: 'Core: a settle that fails before reaching the facilitator (beforeSettle abort or error, settlement-payload enrichment error) now dispatches a VerifiedPaymentCanceled cancellation with the new reason CancellationReasonSettlementPreflightFailed ("settlement_preflight_failed") and empty SettledPhases; it is skipped for cancel settles and for the after-handler settle of flows that also settle before the handler. VerifiedPaymentCanceledContext.VerifyResult carries the trusted verify response for after_verify_aborted. EVM batch-settlement facilitator-managed mode: settleOnCancel releases the facilitator admission lock for settlement_preflight_failed and for after_verify_aborted raised before the scheme afterVerify hook (pendingId recovered from VerifyResult); a refund-signer failure keeps the request context so the cancel can release the lock; afterVerify aborts with invalid_batch_settlement_evm_verification_state_unavailable when pendingId or the channel view (balance, totalClaimed, chargedCumulativeAmount, refundNonce, withdrawRequestedAt) is missing or malformed; afterSettle updates the replica only from a well-formed channelState or verify snapshot (a refund never falls back to its pre-refund snapshot) instead of writing zero defaults; request-context expiry is derived as twice the admission-lock TTL for each payment, which remains clamped to 5 seconds–10 minutes. Unchanged on the wire.'
time: 2026-11-03T12:00:00Z
