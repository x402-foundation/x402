name: Check Payment Channels Codegen

on:
  pull_request:
    paths:
      - ".github/workflows/check_payment_channels_codegen.yml"
      - "typescript/pnpm-lock.yaml"
      - "typescript/packages/mechanisms/svm/idl/**"
      - "scripts/payment-channels-codegen/**"
      - "typescript/packages/mechanisms/svm/src/payment-channels/generated/**"
      - "typescript/packages/mechanisms/svm/package.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: none

jobs:
  check-payment-channels-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.1

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: scripts/payment-channels-codegen/pnpm-lock.yaml

      - name: Install codegen dependencies
        run: pnpm --dir scripts/payment-channels-codegen install --frozen-lockfile --ignore-scripts

      - name: Verify generated client
        run: pnpm --dir scripts/payment-channels-codegen check
