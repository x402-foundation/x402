name: Java CI
on:
  pull_request:
    paths:
      - 'java/**'
      - 'examples/java/**'
      - 'e2e/*/java/**'
      - '.github/workflows/java.yml'
  push:
    branches: [ main ]
    paths:
      - 'java/**'
      - 'examples/java/**'
      - 'e2e/*/java/**'
      - '.github/workflows/java.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: none

jobs:
  legacy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-legacy-${{ hashFiles('java/legacy/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run tests with coverage
      working-directory: ./java/legacy
      run: mvn clean test -Pcoverage

    - name: Run checkstyle
      working-directory: ./java/legacy
      run: mvn checkstyle:check

    - name: Run SpotBugs
      working-directory: ./java/legacy
      run: mvn spotbugs:check

  v2:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-v2-${{ hashFiles('java/**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build, test, coverage, checkstyle, SpotBugs
      working-directory: ./java
      run: mvn -B verify -Pcoverage checkstyle:check spotbugs:check

  # X402HttpClientLifecycleTest needs the JDK 21 HTTP client behaviour, which the JDK 17 v2 job
  # does not exercise.
  core-jdk21:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-core-jdk21-${{ hashFiles('java/**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Test x402-core on JDK 21
      working-directory: ./java
      run: mvn -B -pl x402-core test

  # The examples and the Java e2e components build against the reactor's SNAPSHOT, so they are
  # built here to keep them in step with the SDK.
  examples:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-examples-${{ hashFiles('java/**/pom.xml', 'examples/java/**/pom.xml', 'e2e/*/java/**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Install the SDK
      working-directory: ./java
      run: mvn -B install -DskipTests

    - name: Verify the examples
      run: |
        find examples/java -name pom.xml -not -path '*/target/*' | sort | while read -r pom; do
          echo "::group::$pom"
          mvn -B -f "$pom" verify
          echo "::endgroup::"
        done

    - name: Package the Java e2e components
      run: |
        find e2e -path '*/java/*' -name pom.xml -not -path '*/target/*' | sort | while read -r pom; do
          echo "::group::$pom"
          mvn -B -f "$pom" package -DskipTests
          echo "::endgroup::"
        done

