name: Java CI
on:
  pull_request:
    paths:
      - 'java/**'
  push:
    branches: [ main ]
    paths:
      - 'java/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: none

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ github.job }}-${{ hashFiles('java/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-${{ github.job }}-

    # Checkstyle runs in the validate phase and fails on any violation; verify enforces the coverage gate.
    - name: Build, test and check coverage
      working-directory: ./java
      run: mvn -B verify -Pcoverage

    - name: Run SpotBugs
      working-directory: ./java
      run: mvn -B spotbugs:check

  legacy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Set up JDK 17
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Cache Maven dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ github.job }}-${{ hashFiles('java/legacy/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-${{ github.job }}-

    - name: Run tests with coverage
      working-directory: ./java/legacy
      run: mvn clean test -Pcoverage

    - name: Run checkstyle
      working-directory: ./java/legacy
      run: mvn checkstyle:check

    - name: Run SpotBugs
      working-directory: ./java/legacy
      run: mvn spotbugs:check
