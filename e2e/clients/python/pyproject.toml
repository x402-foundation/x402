[project]
name = "e2e-client"
version = "0.1.0"
description = "Shared client setup for Python e2e clients"
requires-python = ">=3.10"
dependencies = [
    "eth-account>=0.13.0",
    "x402[evm,svm,tvm,extensions]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["client.py"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
required-version = ">=0.11.0"
exclude-newer = "3 days"

[tool.uv.sources]
x402 = { path = "../../../python/x402", editable = true }
