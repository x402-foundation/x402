[project]
name = "e2e-server"
version = "0.1.0"
description = "Shared config/routes for Python e2e resource servers"
requires-python = ">=3.10"
dependencies = [
    "x402[evm,svm,tvm,extensions]"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["catalog.py", "config.py", "handlers.py"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
required-version = ">=0.11.0"
exclude-newer = "3 days"

[tool.uv.sources]
x402 = { path = "../../../python/x402", editable = true }
