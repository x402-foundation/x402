# /etc/nginx/sites-available/hoodgate.conf
# Symlink into /etc/nginx/sites-enabled/ then `nginx -t && systemctl reload nginx`.
#
# Terminates TLS for two public hostnames:
#   - facilitator.hoodgate.example → 127.0.0.1:3001 (facilitator: /verify, /settle)
#   - demo.hoodgate.example        → 127.0.0.1:3005 (demo-api: /weather)
#
# Assumes certbot has issued Let's Encrypt certs — see README ops runbook.

# ── Rate-limit zone (per client IP) ──────────────────────────────────
# Second-layer defense on top of express-rate-limit — protects the Node
# event loop from being buried before requests even reach the app. Sized
# conservatively: bursts absorbed, sustained abuse dropped at 429.
limit_req_zone $binary_remote_addr zone=hoodgate_pub:10m rate=30r/s;
limit_req_status 429;

# Only allow requests with a real Host header — no default_server catch.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444; # close without response
}

# ── Facilitator ──────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name facilitator.hoodgate.example;
    # ACME challenge stays HTTP; everything else redirects.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name facilitator.hoodgate.example;

    ssl_certificate     /etc/letsencrypt/live/facilitator.hoodgate.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/facilitator.hoodgate.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Baseline security headers ────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Bound request body — /verify + /settle payloads are tiny (a few KB).
    # The app also enforces 16 KB; nginx enforces here so we shed early.
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ── /metrics — internal only ─────────────────────────────────────
    # Do NOT expose Prometheus scrape publicly. Restrict to VPN/monitoring
    # subnet (edit or drop this block if scraped over localhost only).
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://127.0.0.1:3001/metrics;
        proxy_set_header Host $host;
    }

    # ── /health — public liveness (used by uptime pinger) ────────────
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3001/health;
        proxy_set_header Host $host;
    }

    # ── /verify + /settle ────────────────────────────────────────────
    location / {
        limit_req zone=hoodgate_pub burst=60 nodelay;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY_HOPS in the facilitator env MUST match the number of
        # X-Forwarded-For prepend layers. Direct nginx→app = 1 hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Settle can block on the RPC broadcast; give it headroom.
        proxy_read_timeout 30s;
        proxy_send_timeout 15s;
        proxy_connect_timeout 5s;
    }
}

# ── Demo API ─────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name demo.hoodgate.example;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name demo.hoodgate.example;

    ssl_certificate     /etc/letsencrypt/live/demo.hoodgate.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.hoodgate.example/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Demo UI is served inline from server.ts — allow same-origin frames only.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        limit_req zone=hoodgate_pub burst=60 nodelay;

        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Weather fetch upstream takes ~1-2s worst-case; add margin.
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        proxy_connect_timeout 5s;
    }
}
