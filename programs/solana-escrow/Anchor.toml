[toolchain]
anchor_version = "0.30.0"
solana_version = "1.18.0"

[features]
seeds  = false
skip-lint = false

[programs.mainnet]
x402_escrow = "x402EscrowProgramIdReplaceAfterDeploy1111111"

[programs.devnet]
x402_escrow = "x402EscrowDevnetProgramIdReplaceAfterDeploy11"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "mainnet"
wallet  = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
