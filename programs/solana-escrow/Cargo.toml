[package]
name    = "x402-escrow"
version = "1.0.0"
edition = "2021"
description = "x402 Solana USDC Escrow Program — Anchor 0.30"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "x402_escrow"

[features]
no-entrypoint  = []
no-idl         = []
no-log-ix-name = []
cpi            = ["no-entrypoint"]
default        = []

[dependencies]
anchor-lang = { version = "0.30.0", features = ["init-if-needed"] }
anchor-spl  = { version = "0.30.0", features = ["token"] }

[dev-dependencies]
anchor-client = "0.30.0"

[profile.release]
overflow-checks = true
lto             = "thin"
